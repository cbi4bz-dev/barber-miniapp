name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "/home/runner/yandex-cloud/bin" >> $GITHUB_PATH
      
      - name: Auth
        run: |
          echo "${{ secrets.YC_SA_JSON_CREDENTIALS }}" > /tmp/key.json
          /home/runner/yandex-cloud/bin/yc config set service-account-key /tmp/key.json
          /home/runner/yandex-cloud/bin/yc config set folder-id b1gsraf10hgd6naabfhg
      
      - name: Docker Auth
        run: |
          /home/runner/yandex-cloud/bin/yc container registry configure-docker
      
      - name: Build
        run: |
          docker build -t cr.yandex/crpnjodd6609b4b1kg2d/barber-api:${{ github.sha }} .
      
      - name: Push
        run: |
          docker push cr.yandex/crpnjodd6609b4b1kg2d/barber-api:${{ github.sha }}
      
      - name: Deploy
        run: |
          /home/runner/yandex-cloud/bin/yc serverless container revision deploy \
            --container-name barber-api \
            --image cr.yandex/crpnjodd6609b4b1kg2d/barber-api:${{ github.sha }} \
            --memory 128M \
            --service-account-id ajekd46q3hnrg2r2m166
