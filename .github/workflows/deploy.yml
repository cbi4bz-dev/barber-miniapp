# .github/workflows/deploy.yml
name: Build and Push to Yandex Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем Yandex Cloud CLI
      - name: Install Yandex Cloud CLI
        uses: nightstory/setup-yc@v1
        with:
          enable-cache: true

      # Сохраняем JSON-ключ в файл и настраиваем yc
      - name: Configure Yandex Cloud CLI
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > /tmp/sa-key.json
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Login to Yandex Cloud Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/barber-api:${{ github.sha }} .
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/barber-api:${{ github.sha }}

      - name: Deploy to Serverless Container
        run: |
          yc serverless container revision deploy \
            --container-name barber-api \
            --image cr.yandex/${{ secrets.YC_REGISTRY_ID }}/barber-api:${{ github.sha }} \
            --memory 128M \
            --execution-timeout 10s \
            --concurrency 10 \
            --service-account-id ajefln1mva94iejdnf1o
